apiVersion: batch/v1
kind: CronJob
metadata:
  name: wallet-extractor
  namespace: crypto-monitoring
spec:
  schedule: "0 2 * * *"  # Ejecutar diariamente a las 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: extractor
            image: crypto-monitor-backend:latest
            imagePullPolicy: IfNotPresent
            command: ["npm", "run", "extract"]
            envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          restartPolicy: OnFailure
