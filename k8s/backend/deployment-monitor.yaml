apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: crypto-monitoring
  labels:
    app: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      containers:
      - name: monitor
        image: crypto-monitor-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["npm", "run", "monitor"]
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
