apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypto-monitoring-ingress
  namespace: crypto-monitoring
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: crypto-monitor.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
