apiVersion: batch/v1
kind: Job
metadata:
  name: reanalyze-performance
  namespace: crypto-monitoring
spec:
  template:
    spec:
      containers:
      - name: reanalyze
        image: crypto-backend:v4-multisource
        imagePullPolicy: IfNotPresent
        command: ["node"]
        args: ["dist/jobs/reanalyzePerformance.js"]
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        env:
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never
  backoffLimit: 2
