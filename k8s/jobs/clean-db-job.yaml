apiVersion: batch/v1
kind: Job
metadata:
  name: clean-database
  namespace: crypto-monitoring
spec:
  template:
    spec:
      containers:
      - name: clean-database
        image: crypto-backend:recent-tx
        imagePullPolicy: IfNotPresent
        command: ["node"]
        args: ["dist/jobs/cleanDatabase.js"]
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        env:
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      restartPolicy: Never
  backoffLimit: 1
