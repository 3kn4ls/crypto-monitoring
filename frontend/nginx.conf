server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets dentro de /crypto
    location ~* ^/crypto/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        alias /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Service Worker dentro de /crypto
    location = /crypto/ngsw-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/ngsw-worker.js;
    }

    location = /crypto/ngsw.json {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/ngsw.json;
    }

    # Manifest dentro de /crypto
    location = /crypto/manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    # Angular routing dentro de /crypto
    location /crypto/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /crypto/index.html;
    }

    # Redirect de /crypto a /crypto/
    location = /crypto {
        return 301 /crypto/;
    }
}
